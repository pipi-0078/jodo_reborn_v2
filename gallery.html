<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浄土再現 — アセットギャラリー</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1408;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
    canvas { display: block; }
    #asset-preview { position: fixed; left: 0; width: 100%; border: 0;
      height: auto; z-index: 4; background: #e8e3d7; }
    #asset-preview[hidden] { display: none; }
    #list {
      position: fixed; top: 0; left: 0; right: 96px; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 8px; padding: 14px;
      box-sizing: border-box; max-height: 30vh; overflow-y: auto;
      background: linear-gradient(to bottom, rgba(26,20,8,0.85), rgba(26,20,8,0.35) 70%, transparent);
    }
    #list button {
      flex: none; padding: 7px 14px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(232,195,122,0.5); background: rgba(26,20,8,0.55);
      color: #e8c37a; font-family: inherit; font-size: 13px; letter-spacing: 0.08em;
    }
    #list button.active { background: #e8c37a; color: #2a2010; }
    #caption {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      box-sizing: border-box; max-height: 42vh; max-height: 42dvh; overflow-y: auto;
      padding: 16px 20px max(16px, env(safe-area-inset-bottom)); color: #f3e5c9;
      background: rgba(26,20,8,0.96); border-top: 1px solid rgba(232,195,122,0.3);
      overscroll-behavior: contain;
    }
    #caption .content { max-width: 760px; margin: 0 auto; }
    #caption .name { margin: 0 0 10px; color: #e8c37a; font-size: 18px; font-weight: normal; line-height: 1.6; }
    #caption .explanation, #caption .scene-note { margin: 0 0 10px; font-size: 15px; line-height: 1.85; }
    #caption .scene-note::before { content: 'この空間では'; display: block; color: #e8c37a; font-size: 12px; }
    #caption details { font-size: 12px; line-height: 1.8; }
    #caption summary { cursor: pointer; color: #e8c37a; padding: 6px 0; }
    #caption .sources { margin: 8px 0; padding-left: 20px; }
    #caption a { color: #ead29e; text-underline-offset: 3px; }
    #caption .desc, #caption .credit { margin-top: 8px; color: #d2c6af; }
    #caption :focus-visible, #list button:focus-visible { outline: 2px solid #fff1cd; outline-offset: 3px; }
    @media (max-width: 600px) {
      #list { padding: 10px; gap: 6px; max-height: 25vh; max-height: 25dvh; }
      #caption { padding: 12px 16px max(12px, env(safe-area-inset-bottom)); }
      #caption .name { font-size: 17px; }
      #caption .explanation, #caption .scene-note { font-size: 14px; }
    }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #e8c37a; letter-spacing: 0.3em; z-index: 5; pointer-events: none; transition: opacity 0.4s; }
    #loading.hidden { opacity: 0; }
    #back { position: fixed; top: 14px; right: 14px; z-index: 11; color: #e8c37a; font-size: 13px;
      text-decoration: none; border: 1px solid rgba(232,195,122,0.5); border-radius: 999px;
      padding: 8px 14px; background: rgba(26,20,8,0.55); letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <div id="list"></div>
  <a id="back" href="./">世界へ →</a>
  <div id="loading">読み込み中</div>
  <section id="caption" aria-label="アセットの解説" tabindex="0"><div class="content">
    <h1 class="name"></h1>
    <p class="explanation"></p>
    <p class="scene-note"></p>
    <details><summary>出典・制作情報</summary><ul class="sources"></ul><div class="desc"></div><div class="credit"></div></details>
  </div></section>
  <script>
    // GitHub Pagesは古いHTMLを10分ほどキャッシュする。その間に新しいデプロイが入ると
    // HTMLが指すJSファイル名が消えていて、画面(ギャラリーの一覧など)が出なくなる。
    // 読み込みに失敗したときだけ、一度だけ問い合わせをやり直す。
    window.addEventListener('error', function (e) {
      var el = e.target;
      if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
      if (sessionStorage.getItem('reloadedForStaleHtml')) return;
      sessionStorage.setItem('reloadedForStaleHtml', '1');
      location.replace(location.pathname + '?r=' + Date.now());
    }, true);
  </script>
  <script type="module" src="/src/gallery.ts"></script>
</body>
</html>
