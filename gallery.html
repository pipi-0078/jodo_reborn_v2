<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浄土再現 — アセットギャラリー</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1408;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
    canvas { display: block; }
    #list {
      position: fixed; top: 0; left: 0; right: 96px; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 8px; padding: 14px;
      background: linear-gradient(to bottom, rgba(26,20,8,0.85), rgba(26,20,8,0.35) 70%, transparent);
    }
    #list button {
      flex: none; padding: 7px 14px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(232,195,122,0.5); background: rgba(26,20,8,0.55);
      color: #e8c37a; font-family: inherit; font-size: 13px; letter-spacing: 0.08em;
    }
    #list button.active { background: #e8c37a; color: #2a2010; }
    #caption {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      padding: 14px 18px 18px; color: #e8c37a; text-align: center;
      background: linear-gradient(to top, rgba(26,20,8,0.85), transparent);
    }
    #caption .name { font-size: 18px; letter-spacing: 0.2em; }
    #caption .desc { font-size: 12.5px; opacity: 0.85; margin-top: 6px; letter-spacing: 0.06em; }
    #caption .credit { font-size: 11px; opacity: 0.6; margin-top: 6px; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #e8c37a; letter-spacing: 0.3em; z-index: 5; pointer-events: none; transition: opacity 0.4s; }
    #loading.hidden { opacity: 0; }
    #back { position: fixed; top: 14px; right: 14px; z-index: 11; color: #e8c37a; font-size: 13px;
      text-decoration: none; border: 1px solid rgba(232,195,122,0.5); border-radius: 999px;
      padding: 8px 14px; background: rgba(26,20,8,0.55); letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <div id="list"></div>
  <a id="back" href="./">世界へ →</a>
  <div id="loading">読み込み中</div>
  <div id="caption"><div class="name"></div><div class="desc"></div><div class="credit"></div></div>
  <script>
    // GitHub Pagesは古いHTMLを10分ほどキャッシュする。その間に新しいデプロイが入ると
    // HTMLが指すJSファイル名が消えていて、画面(ギャラリーの一覧など)が出なくなる。
    // 読み込みに失敗したときだけ、一度だけ問い合わせをやり直す。
    window.addEventListener('error', function (e) {
      var el = e.target;
      if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
      if (sessionStorage.getItem('reloadedForStaleHtml')) return;
      sessionStorage.setItem('reloadedForStaleHtml', '1');
      location.replace(location.pathname + '?r=' + Date.now());
    }, true);
  </script>
  <script type="module" src="/src/gallery.ts"></script>
</body>
</html>
